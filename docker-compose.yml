#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/handout-hackertours-by-vincent:latest@sha256:03d1009ddb733eddeb114b80c84256eeb4b793d235396d9346a50f2a54bb71f6
    restart: on-failure:5
    environment:
      - PASSPHRASE=${PASSPHRASE}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - gotenberg
    ports:
      - "3002:3000"

  gotenberg:
    image: gotenberg/gotenberg:8
