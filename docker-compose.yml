#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/handout-hackertours-by-vincent:latest@sha256:37dfa9606dcc52e34d6f46591db595bfec9482a2b3291ecb20fc153dcd651114
    restart: on-failure:5
    environment:
      - PASSPHRASE=${PASSPHRASE}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - gotenberg
    ports:
      - "3002:3000"

  gotenberg:
    image: gotenberg/gotenberg:8
