#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/handout-hackertours-by-vincent:latest@sha256:c5f39f406c4a21229e11c1b853d3ebc5901bf9696914121146525446e0ac301f
    restart: on-failure:5
    environment:
      - PASSPHRASE=${PASSPHRASE}
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - gotenberg
    ports:
      - "3002:3000"

  gotenberg:
    image: gotenberg/gotenberg:8
